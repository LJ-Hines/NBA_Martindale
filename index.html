<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score Counter</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #141a24;
    --line: #26303f;
    --text: #e8edf4;
    --muted: #9aa7b8;
    --accent: #ff7a1a;
    --loss: #ff5c6c;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, #182234 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    display: grid;
    place-items: center;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    padding: 32px 40px;
    text-align: center;
    min-width: 340px;
  }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .score {
    font-size: 104px;
    font-weight: 800;
    line-height: 1;
    margin: 8px 0 28px;
    font-variant-numeric: tabular-nums;
  }
  button {
    font: inherit;
    font-weight: 700;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    padding: 12px 28px;
    background: var(--accent);
    color: #1a1204;
    font-size: 16px;
    transition: transform 0.08s ease;
  }
  button:active { transform: scale(0.96); }
  button.big { font-size: 30px; padding: 18px 56px; }
  .status { margin: 16px 0 0; font-size: 12px; color: var(--muted); }
  .status.err { color: var(--loss); }
  .hidden { display: none; }
</style>
</head>
<body>
<main class="card">
  <h1>Score</h1>

  <div class="score" id="total">…</div>
  <button class="big" id="incBtn">+1</button>
  <p class="status" id="status">Loading…</p>
</main>

<script>
  const API = "https://abacus.jasoncameron.dev";
  // Unlisted counter: anyone who knows this key can read or increment it.
  const COUNTER = "nba-martindale/score-k7q2x9";
  const POLL_MS = 15000;
  const $ = (id) => document.getElementById(id);

  let current = 0;

  function setStatus(msg, isErr = false) {
    $("status").textContent = msg;
    $("status").classList.toggle("err", isErr);
  }

  // The counter only goes up, so ignore out-of-order (older) responses.
  function show(value) {
    current = Math.max(current, value);
    $("total").textContent = current;
  }

  async function call(action) {
    const res = await fetch(`${API}/${action}/${COUNTER}`, { cache: "no-store" });
    if (action === "get" && res.status === 404) return 0;
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data.value;
  }

  async function refresh() {
    try {
      show(await call("get"));
      setStatus(`Synced ${new Date().toLocaleTimeString()}`);
    } catch (e) {
      setStatus(`Can't load score: ${e.message}`, true);
    }
  }

  $("incBtn").addEventListener("click", async () => {
    $("total").textContent = current + 1;
    try {
      show(await call("hit"));
      setStatus("Saved");
    } catch (e) {
      $("total").textContent = current;
      setStatus(`Not saved: ${e.message}`, true);
    }
  });

  refresh();
  setInterval(refresh, POLL_MS);

  // Live updates when the other person clicks; polling above is the fallback.
  const stream = new EventSource(`${API}/stream/${COUNTER}`);
  stream.onmessage = (e) => {
    try { show(JSON.parse(e.data).value); } catch { /* ignore keep-alives */ }
  };
</script>
</body>
</html>
